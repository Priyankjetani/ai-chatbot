<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nova AI Chatbot</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',sans-serif; background:#0d0d0f; color:#e0e0e0; height:100vh; display:flex; align-items:center; justify-content:center; }
  .chat-wrapper { width:100%; max-width:780px; height:92vh; display:flex; flex-direction:column; background:#131316; border-radius:20px; border:1px solid #2a2a35; overflow:hidden; }
  .chat-header { padding:18px 24px; background:#1a1a22; border-bottom:1px solid #2a2a35; display:flex; align-items:center; gap:14px; }
  .bot-avatar { width:42px; height:42px; background:linear-gradient(135deg,#6366f1,#8b5cf6); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; }
  .bot-info h2 { font-size:16px; color:#fff; } .bot-info span { font-size:12px; color:#6366f1; }
  .status-dot { width:8px; height:8px; background:#22c55e; border-radius:50%; margin-left:auto; box-shadow:0 0 6px #22c55e; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .clear-btn { background:#2a2a35; border:none; color:#aaa; padding:6px 14px; border-radius:8px; cursor:pointer; font-size:12px; }
  .clear-btn:hover { background:#3a3a48; color:#fff; }
  .chat-messages { flex:1; overflow-y:auto; padding:24px 20px; display:flex; flex-direction:column; gap:18px; scroll-behavior:smooth; }
  .chat-messages::-webkit-scrollbar { width:4px; } .chat-messages::-webkit-scrollbar-thumb { background:#3a3a48; border-radius:4px; }
  .message { display:flex; gap:12px; max-width:85%; animation:fadeIn .3s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .message.user { align-self:flex-end; flex-direction:row-reverse; } .message.bot { align-self:flex-start; }
  .msg-avatar { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; margin-top:2px; }
  .bot .msg-avatar { background:linear-gradient(135deg,#6366f1,#8b5cf6); } .user .msg-avatar { background:linear-gradient(135deg,#0ea5e9,#38bdf8); }
  .msg-bubble { padding:12px 16px; border-radius:16px; font-size:14px; line-height:1.6; }
  .bot .msg-bubble { background:#1e1e2a; border:1px solid #2a2a40; border-top-left-radius:4px; color:#ddd; }
  .user .msg-bubble { background:linear-gradient(135deg,#6366f1,#8b5cf6); border-top-right-radius:4px; color:#fff; }
  .msg-content { display:flex; flex-direction:column; } .user .msg-content { align-items:flex-end; }
  .msg-time { font-size:10px; color:#555; margin-top:4px; padding:0 4px; } .user .msg-time { text-align:right; }
  .typing-indicator { display:flex; gap:5px; padding:4px 2px; }
  .typing-indicator span { width:7px; height:7px; background:#6366f1; border-radius:50%; animation:bounce 1.2s infinite; }
  .typing-indicator span:nth-child(2){animation-delay:.2s} .typing-indicator span:nth-child(3){animation-delay:.4s}
  @keyframes bounce { 0%,80%,100%{transform:translateY(0);opacity:.4} 40%{transform:translateY(-6px);opacity:1} }
  .chat-input-area { padding:16px 20px; background:#1a1a22; border-top:1px solid #2a2a35; display:flex; gap:12px; align-items:flex-end; }
  .input-box { flex:1; background:#0d0d0f; border:1px solid #2a2a40; border-radius:14px; padding:12px 16px; color:#e0e0e0; font-size:14px; resize:none; max-height:120px; outline:none; font-family:inherit; line-height:1.5; }
  .input-box:focus { border-color:#6366f1; } .input-box::placeholder { color:#444; }
  .send-btn { width:46px; height:46px; background:linear-gradient(135deg,#6366f1,#8b5cf6); border:none; border-radius:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .send-btn:disabled { opacity:.4; cursor:not-allowed; }
  .send-btn svg { width:20px; height:20px; fill:white; }
  .error-msg { color:#f87171; font-size:13px; }
</style>
</head>
<body>
<div class="chat-wrapper">
  <div class="chat-header">
    <div class="bot-avatar">🤖</div>
    <div class="bot-info"><h2>Himu AI</h2><span>Flask + Claude Backend</span></div>
    <div class="status-dot"></div>
    <button class="clear-btn" onclick="clearChat()">Clear</button>
  </div>
  <div class="chat-messages" id="messages">
    <div class="message bot">
      <div class="msg-avatar">🤖</div>
      <div class="msg-content">
        <div class="msg-bubble">Hi! I'm Nova. Ask me anything 👋</div>
        <div class="msg-time">Now</div>
      </div>
    </div>
  </div>
  <div class="chat-input-area">
    <textarea class="input-box" id="userInput" placeholder="Type a message..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('userInput');
  const sendBtn    = document.getElementById('sendBtn');
  let history = [];   // stores {role, content} for multi-turn context
  let loading = false;

  function getTime() { return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
  function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px'; }
  function handleKey(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} }

  function addMessage(role, text, isError=false) {
    const isUser = role === 'user';
    const d = document.createElement('div');
    d.className = `message ${role}`;
    d.innerHTML = `
      <div class="msg-avatar">${isUser?'👤':'🤖'}</div>
      <div class="msg-content">
        <div class="msg-bubble ${isError?'error-msg':''}">${text.replace(/\n/g,'<br>')}</div>
        <div class="msg-time">${getTime()}</div>
      </div>`;
    messagesEl.appendChild(d);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const d = document.createElement('div');
    d.className = 'message bot'; d.id = 'typing';
    d.innerHTML = `<div class="msg-avatar">🤖</div><div class="msg-content"><div class="msg-bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div></div>`;
    messagesEl.appendChild(d);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function hideTyping() { const t=document.getElementById('typing'); if(t)t.remove(); }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || loading) return;

    loading = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    addMessage('user', text);
    history.push({ role: 'user', content: text });
    showTyping();

    try {
      // ---- THIS CALLS YOUR FLASK BACKEND ----
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });

      const data = await res.json();
      hideTyping();

      if (!res.ok) {
        addMessage('bot', `⚠️ ${data.error || 'Something went wrong.'}`, true);
      } else {
        addMessage('bot', data.reply);
        history.push({ role: 'assistant', content: data.reply });
      }

    } catch (err) {
      hideTyping();
      addMessage('bot', '⚠️ Cannot reach server. Is Flask running?', true);
    }

    loading = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  function clearChat() {
    history = [];
    messagesEl.innerHTML = '';
    addMessage('bot', 'Chat cleared! Start fresh 👋');
  }
</script>
</body>
</html>
